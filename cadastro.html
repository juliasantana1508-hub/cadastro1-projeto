<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tela de Cadastro</title>

    <style>
        body {
            font-family: Arial, sans-serif;

            /* COLE SEU GRADIENTE AQUI */
            background: linear-gradient(to right top, #fff7c4, #ffe2b6, #ffcdb9, #ffbbcb, #fcb1e4, #ddbaf8, #b8c3ff, #95caff, #8ed9ff, #91e7ff, #9df4fe, #b0fffa);

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #B0FFFA;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #8ac7c3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Criar Conta</h2>

        <form>
            <div class="campo">
                <label>Nome</label>
                <input type="text" placeholder="Seu nome">
            </div>

            <div class="campo">
                <label>E-mail</label>
                <input type="email" placeholder="email@exemplo.com">
            </div>

            <div class="campo">
                <label>Senha</label>
                <input type="password">
            </div>

            <button>Cadastrar</button>
        </form>
    </div>
</body>
</html>
